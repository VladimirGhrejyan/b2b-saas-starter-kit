name: Main CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      NX_DAEMON: 'false'
      HUSKY: '0'
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          filter: tree:0
          persist-credentials: false

      - uses: pnpm/action-setup@v6
        with:
          run_install: false

      - uses: actions/setup-node@v5
        with:
          node-version-file: '.nvmrc'
          cache: pnpm

      - name: Show toolchain
        run: |
          node --version
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Start Postgres and Redis
        run: |
          cp infra/env/.env.example infra/env/.env
          pnpm infra:up
          docker compose --project-directory . --env-file infra/env/.env \
            -f infra/compose/docker-compose.yml \
            -f infra/compose/docker-compose.override.yml \
            up -d --wait

      - name: Derive SHAs for nx affected
        id: setSHAs
        uses: nrwl/nx-set-shas@v5
        with:
          main-branch-name: main
          workflow-id: main-ci.yml

      - run: pnpm nx show projects > /dev/null
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm nx sync:check
      - run: pnpm test:eslint-plugin
      - run: pnpm check:node-version

      - name: Typecheck, test, and build
        run: |
          if [ "${{ steps.setSHAs.outputs.noPreviousBuild }}" = "true" ]; then
            pnpm nx run-many -t typecheck,test,build
          else
            pnpm nx affected -t typecheck,test,build --base="$NX_BASE" --head="$NX_HEAD"
          fi
