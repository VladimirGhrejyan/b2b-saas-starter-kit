name: Web E2E

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    env:
      NX_DAEMON: 'false'
      HUSKY: '0'
      DATABASE_URL: postgres://app:change-me-local-only@localhost:5432/app
      REDIS_URL: redis://localhost:6379
      CORS_ORIGINS: http://localhost:4200
      CORS_CREDENTIALS: 'true'
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6
        with:
          run_install: false

      - uses: actions/setup-node@v5
        with:
          node-version-file: '.nvmrc'
          cache: pnpm

      - name: Show toolchain
        run: |
          node --version
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Start Postgres and Redis
        run: |
          cp infra/env/.env.example infra/env/.env
          pnpm infra:up
          docker compose --project-directory . --env-file infra/env/.env \
            -f infra/compose/docker-compose.yml \
            -f infra/compose/docker-compose.override.yml \
            up -d --wait

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run migrations
        run: pnpm nx run postgres:migration:run

      - name: Run web e2e
        run: pnpm nx run web-e2e:e2e
